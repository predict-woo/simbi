# Xcode project spec — regenerate with `xcodegen generate`.
# The app target is a thin shell; all logic lives in Packages/SimbiKit.
name: Simbi
options:
  bundleIdPrefix: ac.clap
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Icon Composer .icon bundles must land in the project as a single file,
  # not have their contents expanded (XcodeGen#1556) — otherwise Xcode
  # doesn't recognize the app icon.
  fileTypes:
    icon:
      file: true
      buildPhase: resources

packages:
  SimbiKit:
    path: Packages/SimbiKit
  # Auto-update framework (MIT-style). Security-relevant, so patch releases
  # within 2.x are taken automatically rather than pinned.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

targets:
  Simbi:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: SimbiKit
        product: SimbiUI
      - package: Sparkle
        product: Sparkle
    preBuildScripts:
      - name: Vendor anydoc
        script: '"$SRCROOT/scripts/fetch-anydoc.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Copies the vendored anydoc CLI (built by scripts/fetch-anydoc.sh —
      # see the pre-build phase) into the bundle and signs it. The copy
      # happens here, not in a copy-files phase: Xcode plans copy phases
      # before the pre-build script runs, so on a fresh checkout an
      # optional-source copy silently drops the not-yet-built binary.
      # A missing binary fails the build: every app bundle must carry the
      # helper (building it needs a Rust toolchain — see CLAUDE.md).
      # Runs before Xcode's final wrapper signing, so the sealed bundle
      # includes the signed helper. OTHER_CODE_SIGN_FLAGS carries the
      # release workflow's --timestamp (notarization requires a secure
      # timestamp on every nested executable); it is empty in dev builds.
      - name: Bundle and sign anydoc helper
        script: |
          vendored="$SRCROOT/vendor/anydoc/anydoc"
          if [ ! -f "$vendored" ]; then
            echo "error: vendor/anydoc/anydoc missing — scripts/fetch-anydoc.sh must build it (Rust toolchain required)"
            exit 1
          fi
          helpers="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers"
          cp -f "$vendored" "$helpers/anydoc"
          # shellcheck disable=SC2086
          codesign --force --options runtime ${OTHER_CODE_SIGN_FLAGS:-} \
            --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
            "$helpers/anydoc"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ac.clap.simbi
        SWIFT_VERSION: "6.0"
        # App/AppIcon.icon (Icon Composer bundle); actool renders the
        # Liquid Glass icon on macOS 26 and a fallback .icns for older OSes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Overridden by the release workflow from the git tag. Sparkle
        # compares CURRENT_PROJECT_VERSION, so it must only ever increase.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Public half of the EdDSA update-signing keypair. Replace with the
        # output of Sparkle's `generate_keys` — see docs/release-setup.md.
        # Until then Sparkle refuses every update, which is the safe failure.
        SPARKLE_PUBLIC_ED_KEY: "ZsYijCb8MDRcgW5HoikpRVQvjicU/mC+7F8+sQLqczE="
        ENABLE_HARDENED_RUNTIME: YES
        # App Sandbox off (docs/SPEC.md §1): we spawn the codex binary, read
        # ~/.codex/auth.json, and write ~/Simbi.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: App/Info.plist
      properties:
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Auto-update (docs/superpowers/specs/2026-07-27-github-auto-update-design.md).
        # The feed URL is permanent — it ships in every build ever released,
        # so it must never move. Binaries live on GitHub Releases; only this
        # small XML is served from Pages.
        SUFeedURL: https://predict-woo.github.io/simbi/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        # Pre-answered consent: Sparkle skips its permission prompt and
        # defaults to checking automatically but not downloading ("Notify
        # only" in Settings; SUAllowsAutomaticUpdates keeps "Download and
        # ask" available to opt into). Installs are always held for an
        # explicit click — see SparkleCoordinator.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        # Check hourly (Sparkle's default is daily). Irrelevant in "Never"
        # mode, which disables scheduled checks entirely.
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: true
        NSMicrophoneUsageDescription: >-
          Simbi records meeting audio from your microphone to transcribe and
          diarize it into your notes.
        NSAudioCaptureUsageDescription: >-
          Simbi can also capture system audio (the other side of a call, videos)
          so both sides of a conversation land in the transcript.
    entitlements:
      path: App/Simbi.entitlements
      properties:
        com.apple.security.device.audio-input: true
