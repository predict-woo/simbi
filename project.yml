# Xcode project spec — regenerate with `xcodegen generate`.
# The app target is a thin shell; all logic lives in Packages/SimbiKit.
name: Simbi
options:
  bundleIdPrefix: ac.clap
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  SimbiKit:
    path: Packages/SimbiKit
  # Auto-update framework (MIT-style). Security-relevant, so patch releases
  # within 2.x are taken automatically rather than pinned.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.4

targets:
  Simbi:
    type: application
    platform: macOS
    sources:
      - path: App
      # Vendored anydoc CLI (built by scripts/fetch-anydoc.sh — see the
      # pre-build phase) shipped as a helper tool for converter threads.
      # optional: fresh checkouts don't have it yet at generate time; the
      # pre-build phase creates it before the copy phase needs it.
      - path: vendor/anydoc/anydoc
        optional: true
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
    dependencies:
      - package: SimbiKit
        product: SimbiUI
      - package: Sparkle
        product: Sparkle
    preBuildScripts:
      - name: Vendor anydoc
        script: '"$SRCROOT/scripts/fetch-anydoc.sh"'
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # Runs before Xcode's final wrapper signing, so the sealed bundle
      # includes the signed helper. OTHER_CODE_SIGN_FLAGS carries the
      # release workflow's --timestamp (notarization requires a secure
      # timestamp on every nested executable); it is empty in dev builds.
      - name: Sign anydoc helper
        script: |
          # shellcheck disable=SC2086
          codesign --force --options runtime ${OTHER_CODE_SIGN_FLAGS:-} \
            --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" \
            "$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers/anydoc"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ac.clap.simbi
        SWIFT_VERSION: "6.0"
        # Overridden by the release workflow from the git tag. Sparkle
        # compares CURRENT_PROJECT_VERSION, so it must only ever increase.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Public half of the EdDSA update-signing keypair. Replace with the
        # output of Sparkle's `generate_keys` — see docs/release-setup.md.
        # Until then Sparkle refuses every update, which is the safe failure.
        SPARKLE_PUBLIC_ED_KEY: "REPLACE_WITH_generate_keys_OUTPUT"
        ENABLE_HARDENED_RUNTIME: YES
        # App Sandbox off (docs/SPEC.md §1): we spawn the codex binary, read
        # ~/.codex/auth.json, and write ~/Simbi.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: App/Info.plist
      properties:
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Auto-update (docs/superpowers/specs/2026-07-27-github-auto-update-design.md).
        # The feed URL is permanent — it ships in every build ever released,
        # so it must never move. Binaries live on GitHub Releases; only this
        # small XML is served from Pages.
        SUFeedURL: https://predict-woo.github.io/simbi/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        # Deliberately NOT setting SUEnableAutomaticChecks: Sparkle treats it
        # as a pre-answered consent and skips its permission prompt. Leaving
        # it out preserves the ask-on-second-launch behaviour, so a first run
        # is silent. Once the user consents, downloads are on by default.
        SUAutomaticallyUpdate: true
        SUAllowsAutomaticUpdates: true
        NSMicrophoneUsageDescription: >-
          Simbi records meeting audio from your microphone to transcribe and
          diarize it into your notes.
        NSAudioCaptureUsageDescription: >-
          Simbi can also capture system audio (the other side of a call, videos)
          so both sides of a conversation land in the transcript.
    entitlements:
      path: App/Simbi.entitlements
      properties:
        com.apple.security.device.audio-input: true
